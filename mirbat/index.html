<!-- Thème Tailwind : couleurs extraites de la présentation Mirbat -->
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Tajawal", "Segoe UI", Tahoma, system-ui, sans-serif;
    --font-brand: "Reem Kufi", "Tajawal", system-ui, sans-serif;

    --color-navy-900: #0E1B33;
    --color-navy: #17294A;
    --color-navy-700: #223A63;
    --color-navy-500: #5B6B82;
    --color-navy-50: #E8ECF2;
    --color-gold: #D6B26B;
    --color-gold-700: #8E6C2B;
    --color-gold-600: #B08A3E;
    --color-gold-100: #F6EEDC;
    --color-gold-50: #FBF8F1;
    --color-paper: #F3F5F9;
    --color-line: #DCE1EA;
    --color-ink: #1F2937;
    --color-mute: #6B7280;
    --color-ok: #2A6B4F;
    --color-ok-100: #E6F0EA;
    --color-bad: #A6472E;
    --color-bad-100: #FBF1EE;
    --color-sky: #6E93C4;
  }

  @layer components {
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold transition select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50; }
    .btn-primary { @apply bg-navy text-white hover:bg-navy-700; }
    .btn-gold { @apply bg-gold text-navy hover:bg-gold-600 hover:text-white; }
    .btn-ghost { @apply bg-white text-navy ring-1 ring-line hover:bg-paper; }
    .btn-danger { @apply bg-bad text-white hover:brightness-110; }
    .btn-sm { @apply rounded-lg px-3 py-1.5 text-xs; }
    .btn-icon { @apply inline-grid size-9 place-items-center rounded-lg text-navy-500 transition hover:bg-paper hover:text-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold disabled:opacity-30 disabled:hover:bg-transparent; }
    .input { @apply w-full rounded-xl border border-line bg-white px-3.5 py-2.5 text-sm text-ink placeholder:text-mute/70 transition focus:border-gold focus:outline-none focus:ring-4 focus:ring-gold/20; }
    .card { @apply rounded-2xl border border-line bg-white; }
    .card-h { @apply flex flex-wrap items-center justify-between gap-3 border-b border-line px-5 py-4; }
    .card-t { @apply flex items-center gap-2 text-base font-extrabold text-navy; }
    .chip { @apply inline-flex cursor-pointer items-center gap-1.5 rounded-full bg-white px-3 py-1.5 text-xs font-bold text-navy-500 ring-1 ring-line transition hover:ring-gold; }
    .chip[aria-pressed="true"] { @apply bg-navy text-white ring-navy; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-white/70 transition hover:bg-white/5 hover:text-white; }
    .nav-link[aria-current="page"] { @apply bg-gold/15 font-bold text-gold; }
    .tab { @apply border-b-2 border-transparent px-1 pb-2.5 text-sm font-bold text-mute transition hover:text-navy; }
    .tab[aria-selected="true"] { @apply border-gold text-navy; }
    .dl-row { @apply flex items-baseline justify-between gap-4 border-b border-dashed border-line py-2 text-sm last:border-0; }
  }
</style>
<link rel="stylesheet" href="assets/css/app.css">

  <div id="app" class="min-h-full"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
